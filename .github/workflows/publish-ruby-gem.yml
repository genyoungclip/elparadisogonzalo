name: Publish Ruby Gem

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Build gem
        run: gem build elparadisogonzalo.gemspec

      - name: Configure GitHub Packages credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gem

          cat > ~/.gem/credentials <<EOF
          ---
          :github: Bearer ${GITHUB_TOKEN}
          EOF

          chmod 600 ~/.gem/credentials

      - name: Publish gem
        run: |
          gem push \
            --key github \
            --host https://rubygems.pkg.github.com/${{ github.repository_owner }} \
            elparadisogonzalo-*.gem
