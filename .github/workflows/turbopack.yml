name: Next.js Turbopack Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  turbopack:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Turbopack
        run: npx next build

      - name: Show build output
        if: success()
        run: |
          echo "Turbopack build completed successfully."
          ls -lah
