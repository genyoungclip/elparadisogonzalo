name: Build Elparadisogonzalo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: frontend/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          ls -la "$ANDROID_HOME/platforms/android-36"
          ls -la "$ANDROID_HOME/build-tools/36.0.0"

      - name: Locate Gradle wrapper
        run: |
          echo "Current directory:"
          pwd

          echo "Frontend contents:"
          ls -la

          if [ -f "./gradlew" ]; then
            echo "Found: frontend/gradlew"
          elif [ -f "../gradlew" ]; then
            echo "Found: gradlew"
          else
            echo "ERROR: Gradle wrapper not found"
            find .. -maxdepth 4 -name gradlew -type f -print
            exit 1
          fi

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            chmod +x ../gradlew
          fi

      - name: Verify Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            ../gradlew --version
          fi

      - name: Build release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ../gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Find release APK
        run: |
          echo "APK files:"
          find .. -type f -name "*.apk" -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: elparadisogonzalo-release-apk
          path: |
            frontend/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
