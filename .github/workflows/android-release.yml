name: Build Elparadisogonzalo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: frontend/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Verify Capacitor
        run: |
          npx cap --version
          npx cap doctor

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android

      - name: Verify Cordova Android plugins
        run: |
          test -f frontend/android/capacitor-cordova-android-plugins/cordova.variables.gradle

          echo "cordova.variables.gradle:"
          ls -lh frontend/android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Verify Android Gradle project
        working-directory: frontend/android
        run: |
          echo "Android project:"
          pwd

          ls -la

          echo "Gradle wrapper:"
          ls -la gradlew

          echo "Gradle wrapper files:"
          ls -la gradle/wrapper

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Verify Gradle wrapper
        working-directory: frontend/android
        run: ./gradlew --version

      - name: Build release APK
        working-directory: frontend/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find release APK
        run: |
          echo "Release APK files:"
          find frontend/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: elparadisogonzalo-release-apk
          path: frontend/android/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
