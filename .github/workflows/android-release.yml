name: Build Elparadisogonzalo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: frontend/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Make Gradle executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          elif [ -f ../gradlew ]; then
            chmod +x ../gradlew
          else
            echo "ERROR: gradlew was not found"
            echo "Contents of frontend:"
            ls -la
            echo "Searching for Gradle wrapper:"
            find .. -maxdepth 3 -name gradlew -type f -print
            exit 1
          fi

      - name: Verify Gradle wrapper
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --version
          else
            ../gradlew --version
          fi

      - name: Build release APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ../gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Find release APK
        run: |
          echo "Release APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: elparadisogonzalo-release-apk
          path: |
            frontend/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
